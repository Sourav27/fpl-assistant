name: Daily FPL Bootstrap Snapshot

on:
  schedule:
    # 02:00 UTC = 07:30 IST. FPL prices reset ~07:00 IST, so this captures
    # the first post-reset snapshot. GW deadlines (earliest Sat 11:30 UTC)
    # are well after this window.
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the snapshot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live bootstrap snapshot
        run: python scripts/fetch_bootstrap_snapshots.py --live

      - name: Commit snapshot if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/snapshots/bootstrap_gw*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily bootstrap snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'EOF'
          import os, json, requests, datetime

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL secret not set — skipping notification.")
              exit(0)

          summary_path = "results/snapshots/price_changes_latest.txt"
          if os.path.exists(summary_path):
              summary = open(summary_path, encoding="utf-8").read().strip()
          else:
              summary = "No price change summary generated."

          date_str = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          header = f"**FPL Price Changes — {date_str}**"

          # Discord code block; hard limit 2000 chars per message
          body = f"```\n{summary}\n```"
          if len(header) + len(body) + 1 > 2000:
              max_summary = 2000 - len(header) - 10  # 10 = code fences + newline + margin
              body = f"```\n{summary[:max_summary]}\n… (truncated)\n```"

          payload = {"content": f"{header}\n{body}"}
          r = requests.post(webhook, json=payload, timeout=10)
          r.raise_for_status()
          print(f"Discord notification sent (HTTP {r.status_code})")
          EOF
