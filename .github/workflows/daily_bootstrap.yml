name: Daily FPL Bootstrap Snapshot

on:
  # Schedule disabled — triggered externally via cron-job.org at 07:06 IST (01:36 UTC)
  # to avoid GitHub Actions queue delays (~2.7h late on the built-in scheduler).
  workflow_dispatch:  # Allow manual trigger + cron-job.org webhook

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the snapshot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live bootstrap snapshot
        run: python scripts/fetch_bootstrap_snapshots.py --live

      - name: Commit snapshot if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/snapshots/bootstrap_gw*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily bootstrap snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi

      - name: Check GW finished
        id: gw_check
        run: |
          SNAPSHOT=$(ls results/snapshots/bootstrap_gw*.json 2>/dev/null | sort -V | tail -1)
          if [ -z "$SNAPSHOT" ]; then
            echo "No snapshot found — skipping post-gw check."
            echo "gw_finished=false" >> $GITHUB_OUTPUT
          else
            python scripts/check_gw_finished.py "$SNAPSHOT"
          fi

      - name: Install full pipeline deps for post-gw
        if: steps.gw_check.outputs.gw_finished == 'true'
        run: pip install -r requirements.txt

      - name: Write user_config.yaml for post-gw
        id: postgw_config
        if: steps.gw_check.outputs.gw_finished == 'true'
        env:
          USER_CONFIG_YAML: ${{ secrets.USER_CONFIG_YAML }}
        run: |
          if [ -z "$USER_CONFIG_YAML" ]; then
            echo "USER_CONFIG_YAML not set — skipping post-gw."
            echo "config_available=false" >> $GITHUB_OUTPUT
          else
            printf '%s' "$USER_CONFIG_YAML" > user_config.yaml
            echo "config_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Run post-gw analysis
        if: |
          steps.gw_check.outputs.gw_finished == 'true' &&
          steps.postgw_config.outputs.config_available == 'true'
        run: |
          GW=${{ steps.gw_check.outputs.current_gw }}
          echo "Running post-gw analysis for GW${GW}..."
          python -m src.pipeline.run post-gw

      - name: Commit accuracy log update
        if: |
          steps.gw_check.outputs.gw_finished == 'true' &&
          steps.postgw_config.outputs.config_available == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/accuracy_log.csv || true
          if git diff --cached --quiet; then
            echo "No accuracy log changes to commit."
          else
            git commit -m "chore: update accuracy_log.csv with gameweek ${{ steps.gw_check.outputs.current_gw }} performance data"
            git pull --rebase && git push
          fi

      - name: Notify Discord — post-gw accuracy
        if: |
          steps.gw_check.outputs.gw_finished == 'true' &&
          steps.postgw_config.outputs.config_available == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PREDICT_RECOMMEND_WEBHOOK_URL }}
        run: |
          python - <<'EOF'
          import os, requests, datetime, subprocess, sys

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_PREDICT_RECOMMEND_WEBHOOK_URL not set — skipping post-gw notification.")
              sys.exit(0)

          gw = "${{ steps.gw_check.outputs.current_gw }}"
          result = subprocess.run(
              [sys.executable, "scripts/format_accuracy_discord.py", "results/accuracy_log.csv", gw],
              capture_output=True, text=True,
          )
          body = result.stdout.strip() or f"Post-GW{gw} analysis complete — accuracy log updated."

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          date_str = datetime.datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
          content = f"**FPL GW{gw} — {date_str}**\n\n{body}"
          if len(content) > 2000:
              content = content[:1990] + "\n… (truncated)"

          r = requests.post(webhook, json={"content": content}, timeout=10)
          r.raise_for_status()
          print(f"Discord accuracy notification sent (HTTP {r.status_code})")
          EOF

      - name: Check deadline proximity
        id: deadline_check
        run: |
          # Find the bootstrap file for the next GW
          SNAPSHOT=$(ls results/snapshots/bootstrap_gw*.json 2>/dev/null | sort -V | tail -1)
          if [ -z "$SNAPSHOT" ]; then
            echo "No snapshot found — skipping deadline check."
            echo "deadline_approaching=false" >> $GITHUB_OUTPUT
          else
            python scripts/check_deadline.py "$SNAPSHOT"
          fi

      - name: Notify Discord — deadline approaching
        if: steps.deadline_check.outputs.deadline_approaching == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEADLINE_WEBHOOK_URL }}
        run: |
          python - <<'EOF'
          import os, requests, datetime

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_DEADLINE_WEBHOOK_URL not set — skipping notification.")
              exit(0)

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          gw = "${{ steps.deadline_check.outputs.next_gw }}"
          hours = "${{ steps.deadline_check.outputs.hours_until }}"
          date_str = datetime.datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
          content = (
              f"**FPL GW{gw} Deadline Alert — {date_str}**\n"
              f"Deadline in **{hours}h** — running predict + recommend now."
          )
          r = requests.post(webhook, json={"content": content}, timeout=10)
          r.raise_for_status()
          print(f"Discord notified (HTTP {r.status_code})")
          EOF

      - name: Download models from latest release
        id: model_download
        if: steps.deadline_check.outputs.deadline_approaching == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release list returns reverse-chronological order; take first match
          LATEST=$(gh release list --limit 20 --json tagName \
            --jq '[.[] | select(.tagName | test("^model-|^gw"))][0].tagName')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No GitHub Release found — predict/recommend will use ep_next fallback."
            echo "model_available=false" >> $GITHUB_OUTPUT
          else
            echo "Latest release: $LATEST"
            mkdir -p models

            # Try to download active_models.json manifest
            if gh release download "$LATEST" --pattern "active_models.json" --dir models --clobber 2>/dev/null; then
              echo "Manifest found — downloading listed model files"
              python scripts/download_models_from_manifest.py "$LATEST"
            else
              echo "No manifest — falling back to downloading all *.sav files"
              gh release download "$LATEST" --pattern "*.sav" --dir models --clobber
            fi
            ls models/*.sav 2>/dev/null || echo "No .sav files downloaded"
            echo "model_available=true" >> $GITHUB_OUTPUT
            echo "model_tag=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Write user_config.yaml
        id: user_config
        if: steps.deadline_check.outputs.deadline_approaching == 'true'
        env:
          USER_CONFIG_YAML: ${{ secrets.USER_CONFIG_YAML }}
        run: |
          if [ -z "$USER_CONFIG_YAML" ]; then
            echo "USER_CONFIG_YAML secret not set — skipping predict/recommend."
            echo "config_available=false" >> $GITHUB_OUTPUT
          else
            printf '%s' "$USER_CONFIG_YAML" > user_config.yaml
            echo "config_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Install full pipeline dependencies
        if: |
          steps.deadline_check.outputs.deadline_approaching == 'true' &&
          steps.user_config.outputs.config_available == 'true'
        run: pip install -r requirements.txt

      - name: Run predict + recommend
        if: |
          steps.deadline_check.outputs.deadline_approaching == 'true' &&
          steps.user_config.outputs.config_available == 'true'
        run: |
          GW=${{ steps.deadline_check.outputs.next_gw }}
          echo "Running predict for GW${GW}..."
          python -m src.pipeline.run predict --gw "$GW"
          echo "Running recommend for GW${GW}..."
          python -m src.pipeline.run recommend --gw "$GW"

      - name: Commit predict/recommend results
        if: |
          steps.deadline_check.outputs.deadline_approaching == 'true' &&
          steps.user_config.outputs.config_available == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/predictions_gw*.csv results/xi_gw*.csv results/squad_gw*.csv results/recommend_gw*.csv || true
          if git diff --cached --quiet; then
            echo "No predict/recommend output to commit."
          else
            git commit -m "chore: auto predict+recommend GW${{ steps.deadline_check.outputs.next_gw }} ($(date -u +%Y-%m-%d))"
            git pull --rebase && git push
          fi

      - name: Notify Discord — predict/recommend results
        if: |
          steps.deadline_check.outputs.deadline_approaching == 'true' &&
          steps.user_config.outputs.config_available == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PREDICT_RECOMMEND_WEBHOOK_URL }}
        run: |
          python - <<'EOF'
          import os, requests, datetime, subprocess, sys

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_PREDICT_RECOMMEND_WEBHOOK_URL not set — skipping.")
              sys.exit(0)

          gw = "${{ steps.deadline_check.outputs.next_gw }}"
          result = subprocess.run(
              [
                  sys.executable, "scripts/format_discord_results.py",
                  f"results/xi_gw{gw}.csv",
                  f"results/squad_recommend_gw{gw}.csv",
                  f"results/xi_recommend_gw{gw}.csv",
                  f"results/recommend_gw{gw}.csv",
                  gw,
              ],
              capture_output=True, text=True,
          )
          body = result.stdout.strip() or "No predict/recommend output found."

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          date_str = datetime.datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
          content = f"**FPL GW{gw} — {date_str}**\n\n{body}"
          if len(content) > 2000:
              content = content[:1990] + "\n… (truncated)"

          r = requests.post(webhook, json={"content": content}, timeout=10)
          r.raise_for_status()
          print(f"Discord results sent (HTTP {r.status_code})")
          EOF

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRICE_CHANGE_WEBHOOK_URL }}
        run: |
          python - <<'EOF'
          import os, json, requests, datetime

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL secret not set — skipping notification.")
              exit(0)

          summary_path = "results/snapshots/price_changes_latest.txt"
          if os.path.exists(summary_path):
              summary = open(summary_path, encoding="utf-8").read().strip()
          else:
              summary = "No price change summary generated."

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          date_str = datetime.datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")
          content = f"**FPL Price Changes — {date_str}**\n{summary}"

          # Discord hard limit: 2000 chars per message
          if len(content) > 2000:
              content = content[:1990] + "\n… (truncated)"

          payload = {"content": content}
          r = requests.post(webhook, json=payload, timeout=10)
          r.raise_for_status()
          print(f"Discord notification sent (HTTP {r.status_code})")
          EOF
